name: Atualizar Snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar animações
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LuigiFM
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#DDD6FE,#C4B5FD,#8B5CF6,#6D28D9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#252044,#433170,#6D28D9,#8B5CF6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
